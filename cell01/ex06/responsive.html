<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Responsiva</title>
    <style>
        body {
            margin: 0px;
        }

        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            color: white;
            text-align: justify;
            overflow-wrap: break-word;
        }
        
        .cosmo {
            background-color: rgb(88, 194, 102)
        }

        .wanda {
            background-color: rgb(197, 39, 176);
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="cosmo"><strong>Cosmo</strong></td>
            <td class="wanda"><strong>Wanda</strong></td>
        </tr>
        <tr>
            <td class="cosmo"><strong>Cosmo</strong></td>
            <td class="wanda"><strong>Wanda</strong></td>
        </tr>
        <tr>
            <td class="cosmo"><strong>Cosmo</strong></td>
            <td class="wanda"><strong>Wanda</strong></td>
        </tr>
        <tr>
            <td class="cosmo"><strong>Cosmo</strong></td>
            <td class="wanda"><strong>Wanda</strong></td>
        </tr>
        <tr>
            <td class="cosmo"><strong>Cosmo</strong></td>
            <td class="wanda"><strong>Wanda</strong></td>
        </tr>
    </table>
</body>
</html>
